        }

         /**
          * Helper function to determine if a color is light.
          * Used to choose appropriate text color for contrast.
          * @param {string} hexColor - The color in hex format (e.g., '#RRGGBB').
          * @returns {boolean} True if the color is light, false otherwise.
          */
         function isLight(hexColor) {
             if (!hexColor || typeof hexColor !== 'string' || !hexColor.startsWith('#')) {
                 return true; // Assume light if invalid color
             }
             const hex = hexColor.replace('#', '');
             const r = parseInt(hex.substring(0, 2), 16);
             const g = parseInt(hex.substring(2, 4), 16);
             const b = parseInt(hex.substring(4, 6), 16);
             const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
             return luminance > 0.5; // Threshold for light vs dark
         }

         /**
          * Helper function to attempt to get a common name for a hex color.
          * Very basic implementation. Could be expanded.
          * @param {string} hexColor - The color in hex format.
          * @returns {string | null} A common color name or null if not recognized.
          */
         function colorNameToHex(hexColor) {
             const colors = {
                 '#fef08a': 'Yellow',
                 '#d9f991': 'Lime',
                 '#a7f3d0': 'Emerald',
                 '#bae6fd': 'Light Blue',
                 '#c4b5fd': 'Violet',
                 '#fbcfe8': 'Pink',
                 '#fecaca': 'Red',
                 '#e5e7eb': 'Gray',
                 '#fde68a': 'Yellow',
                 '#a3e635': 'Lime',
                 '#34d399': 'Emerald',
                 '#60a5fa': 'Blue',
                 '#818cf8': 'Indigo',
                 '#e879f9': 'Fuchsia',
                 '#f87171': 'Red',
                 '#9ca3af': 'Gray'
                 // Add more common colors if needed
             };
             return colors[hexColor.toLowerCase()] || hexColor; // Return name if found, otherwise hex
         }


        /**
         * Renders all tasks onto the active board based on their status (standard board)
         * or onto the main board based on their color (main board).
         */
        function renderTasks() {
            if (activeBoardId === MAIN_BOARD_ID) {
                renderMainBoardContent(); // Re-render main board
            } else {
                const activeBoardTasks = getActiveBoardTasks();

                // Clear existing tasks from lists in all columns of the active board
                const taskLists = boardContainer.querySelectorAll('.task-list');
                taskLists.forEach(list => list.innerHTML = '');

                if (!activeBoardTasks || activeBoardTasks.length === 0) {
                     return; // Do nothing if no active board or no tasks
                }

                // Add tasks to the correct columns based on their status
                activeBoardTasks.forEach(task => {
                    // Find the column element by its ID (which matches the task status) within the active board
                    const column = boardContainer.querySelector(`#${task.status}`);
                    if (column) {
                        // Find the task list div within the column
                        const taskList = column.querySelector('.task-list');
                        if (taskList) {
                             // Create the HTML element for the task
                             const taskElement = createTaskElement(task);
                             // Append the task element to the correct task list
                             taskList.appendChild(taskElement);
                        } else {
                             console.error(`Task list not found within column "${task.status}" for task:`, task);
                        }
                    } else {
                        // Log a warning if a column for a task's status doesn't exist
                        console.warn(`Column with id "${task.status}" not found for task:`, task);
                    }
                });
            }
        }

         /**
          * Handles the double-click event on a column header to enable editing.
          * @param {Event} event - The dblclick event.
          */
         function handleColumnHeaderDoubleClick(event) {
            // Only allow editing on standard boards, not the main board
            if (activeBoardId === MAIN_BOARD_ID) return;

            const headerDiv = event.target.closest('.column-header');
            if (!headerDiv) return; // Should not happen if event listener is on .column-header

            const columnId = headerDiv.dataset.columnId;
            const currentName = headerDiv.querySelector('h2').textContent;

            // Create an input element
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentName;
            input.className = 'flex-grow p-1 border border-gray-300 rounded-md text-xl font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-blue-500'; // Apply some styling

            // Replace the h2 with the input
            headerDiv.innerHTML = ''; // Clear existing content
            headerDiv.appendChild(input);

            // Focus the input and select the text
            input.focus();
            input.select();

            // Add event listeners to save the new name
            const saveName = () => {
                const newName = input.value.trim();
                if (newName && newName !== currentName) {
                    // Find the column in the state and update its name
                    const activeBoard = boards[activeBoardId];
                    if (activeBoard) {
                        const column = activeBoard.columns.find(col => col.id === columnId);
                        if (column) {
                            column.name = newName;
                            saveBoards(); // Save the updated state
                        }
                    }
                }
                // Replace the input back with the h2
                renderColumnHeader(headerDiv, columnId); // Re-render this specific header
            };

            input.addEventListener('blur', saveName); // Save when input loses focus
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Prevent default form submission if any
                    saveName(); // Save on Enter key
                }
            });
         }

         /**
          * Renders a single column header element based on the current state.
          * Used after editing a column name.
          * @param {HTMLElement} headerDiv - The existing column header div element.
          * @param {string} columnId - The ID of the column to render the header for.
          */
         function renderColumnHeader(headerDiv, columnId) {
             const activeBoard = boards[activeBoardId];
             const column = activeBoard ? activeBoard.columns.find(col => col.id === columnId) : null;

             if (column) {
                 headerDiv.innerHTML = ''; // Clear existing content
                 const h2 = document.createElement('h2');
                 h2.textContent = column.name;
                 h2.className = 'text-xl font-semibold text-gray-700 mb-0'; // Match original h2 styling
                 headerDiv.appendChild(h2);

                 // Re-attach the double-click listener
                 headerDiv.addEventListener('dblclick', handleColumnHeaderDoubleClick);
             } else {
                 console.error("Column not found for rendering header:", columnId);
                 // Optionally, remove the header div or show an error state
             }
         }


         /**
          * Deletes a task by its ID from the specified board.
          * @param {string} taskId - The ID of the task to delete.
          * @param {string} [boardId=activeBoardId] - The ID of the board the task belongs to. Defaults to the active board.
          */
         function deleteTask(taskId, boardId = activeBoardId) {
            const targetBoard = boards[boardId];
            if (!targetBoard || !targetBoard.tasks) {
                 console.error("Cannot delete task: Target board or tasks array not found.", boardId);
                 return;
            }

            const taskIndex = targetBoard.tasks.findIndex(task => task.id === taskId);
            if (taskIndex > -1) {
                targetBoard.tasks.splice(taskIndex, 1); // Remove the task from the array
                saveBoards(); // Save the updated state
                renderTasks(); // Re-render the tasks (will re-render the active board)
            } else {
                 console.warn(`Task with ID ${taskId} not found in board ${boardId} for deletion.`);
            }
         }


        /**
         * Adds a new task to the 'todo' column of the active board.
         */
        function addTask() {
            // Only allow adding tasks on standard boards, not the main board
            if (activeBoardId === MAIN_BOARD_ID) {
                 alert("Cannot add tasks directly to the Main Board. Add tasks to individual project boards."); // Use a simple alert
                 newTaskInput.value = ''; // Clear the input field
                 return;
            }

            const title = newTaskInput.value.trim();
            if (title === '') {
                alert('Task title cannot be empty.'); // Use a simple alert for now, could replace with a custom message box
                return;
            }

            const activeBoardTasks = getActiveBoardTasks();
            if (!activeBoardTasks) {
                 console.error("Cannot add task: No active board tasks array found.");
                 return;
            }

            const newTask = {
                id: generateId(),
                text: title,
                status: 'todo', // New tasks go to the 'To Do' column by default
                description: '',
                dueDate: '',
                assignee: '',
                color: '' // Default color
            };

            activeBoardTasks.push(newTask); // Add the new task to the active board's tasks
            newTaskInput.value = ''; // Clear the input field
            saveBoards(); // Save the updated state
            renderTasks(); // Re-render the tasks to show the new one
        }


        // --- Drag and Drop Functions ---

        let draggedTask = null; // To keep track of the task being dragged

        /**
         * Handles the start of a drag operation.
         * @param {Event} event - The dragstart event.
         */
        function dragStart(event) {
            draggedTask = event.target; // The element being dragged is the task card
            // Store task ID and its original board ID
            event.dataTransfer.setData('text/plain', draggedTask.id);
            event.dataTransfer.setData('text/boardid', draggedTask.dataset.originalBoardId || activeBoardId); // Use originalBoardId if present, otherwise activeBoardId

            setTimeout(() => {
                draggedTask.classList.add('dragging'); // Add a class for styling while dragging
            }, 0); // Use setTimeout to allow the element to be cloned before adding the class
        }

        /**
         * Handles the end of a drag operation.
         * @param {Event} event - The dragend event.
         */
        function dragEnd(event) {
            if (draggedTask) {
                draggedTask.classList.remove('dragging'); // Remove the dragging class
                draggedTask = null; // Reset the dragged task
            }
             // Remove drag-over class from all columns
             document.querySelectorAll('.kanban-column, .main-board-column').forEach(col => col.classList.remove('drag-over'));
        }

        /**
         * Handles a dragged element moving over a valid drop target.
         * @param {Event} event - The dragover event.
         */
        function dragOver(event) {
            event.preventDefault(); // Necessary to allow dropping
            const column = event.target.closest('.kanban-column') || event.target.closest('.main-board-column');
            if (column) {
                column.classList.add('drag-over'); // Add visual feedback
            }
        }

        /**
         * Handles a dragged element leaving a drop target.
         * @param {Event} event - The dragleave event.
         */
        function dragLeave(event) {
            const column = event.target.closest('.kanban-column') || event.target.closest('.main-board-column');
            if (column) {
                column.classList.remove('drag-over'); // Remove visual feedback
            }
        }

        /**
         * Handles the drop event when a dragged element is dropped onto a STANDARD board column.
         * Updates the task's status.
         * @param {Event} event - The drop event.
         */
        function drop(event) {
            event.preventDefault();
            const column = event.target.closest('.kanban-column');
            if (!column || activeBoardId === MAIN_BOARD_ID) return; // Not dropped on a standard column or on main board

            column.classList.remove('drag-over'); // Remove visual feedback

            const taskId = event.dataTransfer.getData('text/plain');
            const originalBoardId = event.dataTransfer.getData('text/boardid'); // Get original board ID

            const taskElement = document.getElementById(taskId);
            const targetBoard = boards[originalBoardId];

            if (taskElement && column && targetBoard && targetBoard.tasks) {
                const taskList = column.querySelector('.task-list');
                const task = targetBoard.tasks.find(t => t.id === taskId);

                if (taskList && task) {
                    const oldStatus = task.status;
                    const newStatus = column.id; // The column's ID is the new status

                    // Update status only if dropped on a different status column
                    if (oldStatus !== newStatus) {
                        task.status = newStatus;
                        saveBoards(); // Save the updated state

                        // If dropped on the active board, move the element in the DOM
                        if (originalBoardId === activeBoardId) {
                             taskList.appendChild(taskElement);
                        } else {
                            // If dropped on a different board, the task will disappear from the current view
                            // and appear on the other board when that board is selected.
                            // We need to remove the element from the current DOM if it's still there.
                             if (taskElement.parentElement) {
                                 taskElement.parentElement.removeChild(taskElement);
                             }
                        }


                        // Trigger confetti if moved to 'done' column on its original board
                        // Or if dropped into the 'done' column on the current active board view
                        if (newStatus === 'done') {
                            triggerConfetti();
                        }

                        // Re-render the relevant boards if needed (e.g., if dragging between boards)
                        // For simplicity, we'll just re-render the active board.
                        // A more complex implementation might update both source and target boards.
                        renderTasks(); // Re-render the active board to reflect changes
                    }
                } else {
                     console.error("Task or task list not found during drop:", taskId, column.id);
                }
            } else {
                 console.warn("Drop failed: Task element, column, or target board not found.");
            }
        }

         /**
          * Handles the drop event when a dragged element is dropped onto a MAIN board column.
          * Updates the task's color.
          * @param {Event} event - The drop event.
          */
         function dropOnMainBoard(event) {
             event.preventDefault();
             const column = event.target.closest('.main-board-column');
             if (!column || activeBoardId !== MAIN_BOARD_ID) return; // Not dropped on a main board column

             column.classList.remove('drag-over'); // Remove visual feedback

             const taskId = event.dataTransfer.getData('text/plain');
             const originalBoardId = event.dataTransfer.getData('text/boardid'); // Get original board ID
             const newColor = column.dataset.color; // The color of the column

             const targetBoard = boards[originalBoardId];

             if (targetBoard && targetBoard.tasks) {
                 const task = targetBoard.tasks.find(t => t.id === taskId);

                 if (task) {
                     // Update the task's color in its original board's state
                     task.color = newColor;
                     saveBoards(); // Save the updated state

                     // Re-render the main board to reflect the color change
                     renderMainBoardContent();
                 } else {
                     console.error("Task not found in original board during main board drop:", taskId, originalBoardId);
                 }
             } else {
                 console.warn("Drop on main board failed: Target board or tasks array not found.");
             }
         }


        /**
         * Triggers a confetti animation.
         */
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // --- Local Storage ---

        const STORAGE_KEY = 'kanbanBoards';

        /**
         * Saves the current boards state to local storage.
         */
        function saveBoards() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(boards));
        }

        /**
         * Loads the boards state from local storage.
         * @returns {object} The loaded boards object, or an empty object if none found.
         */
        function loadBoards() {
            const storedBoards = localStorage.getItem(STORAGE_KEY);
            return storedBoards ? JSON.parse(storedBoards) : {};
        }

        // --- Modal Functions ---

        let currentEditingTaskId = null; // To keep track of the task being edited
        let currentEditingTaskBoardId = null; // To track the original board of the task being edited

        /**
         * Opens the task modal and populates it with task data.
         * @param {string} taskId - The ID of the task to edit.
         * @param {string} [boardId=activeBoardId] - The ID of the board the task belongs to. Defaults to the active board.
         */
        function openTaskModal(taskId, boardId = activeBoardId) {
            const targetBoard = boards[boardId];
            if (!targetBoard || !targetBoard.tasks) {
                 console.error("Cannot open modal: Target board or tasks array not found.", boardId);
                 return;
            }

            const task = targetBoard.tasks.find(t => t.id === taskId);

            if (task) {
                currentEditingTaskId = taskId;
                currentEditingTaskBoardId = boardId; // Store the original board ID
                modalTaskId.value = task.id;
                modalTaskBoardId.value = boardId; // Set the hidden input value
                modalTaskTitle.value = task.text;
                modalTaskDescription.value = task.description || ''; // Use empty string for null/undefined
                modalTaskDueDate.value = task.dueDate || '';
                modalTaskAssignee.value = task.assignee || '';
                modalTaskColor.value = task.color || '#e5e7eb'; // Default to gray if no color set

                // Update color swatch selection
                updateColorSwatchSelection(task.color || '#e5e7eb');

                taskModal.style.display = 'block';
            } else {
                console.error("Task not found for modal:", taskId);
            }
        }

        /**
         * Closes the task modal.
         */
        function closeTaskModal() {
            taskModal.style.display = 'none';
            currentEditingTaskId = null; // Clear the editing task ID
            currentEditingTaskBoardId = null; // Clear the editing board ID
            // Clear modal fields
            modalTaskId.value = '';
            modalTaskBoardId.value = '';
            modalTaskTitle.value = '';
            modalTaskDescription.value = '';
            modalTaskDueDate.value = '';
            modalTaskAssignee.value = '';
            modalTaskColor.value = '#e5e7eb'; // Reset color picker
             updateColorSwatchSelection('#e5e7eb'); // Reset swatch selection
        }

        /**
         * Saves the changes made in the task modal to the task in its original board.
         */
        function saveTaskChanges() {
            if (!currentEditingTaskId || !currentEditingTaskBoardId) return;

            const targetBoard = boards[currentEditingTaskBoardId];
             if (!targetBoard || !targetBoard.tasks) {
                 console.error("Cannot save changes: Target board or tasks array not found.", currentEditingTaskBoardId);
                 return;
            }

            const task = targetBoard.tasks.find(t => t.id === currentEditingTaskId);

            if (task) {
                const newTitle = modalTaskTitle.value.trim();
                 // Ensure title is not empty
                if (newTitle === '') {
                     alert('Task title cannot be empty.'); // Use a simple alert for now
                     return; // Don't save or close if title is empty
                }

                task.text = newTitle;
                task.description = modalTaskDescription.value.trim();
                task.dueDate = modalTaskDueDate.value;
                task.assignee = modalTaskAssignee.value.trim();
                task.color = modalTaskColor.value;

                saveBoards(); // Save the updated state
                renderTasks(); // Re-render tasks to reflect changes (will re-render the active board)
                closeTaskModal(); // Close the modal
            } else {
                console.error("Task not found for saving changes:", currentEditingTaskId);
            }
        }

        // Close modal when clicking outside of it
        window.addEventListener('click', function(event) {
            if (event.target === taskModal) {
                closeTaskModal();
            }
        });

        // Close modal with the close button
        closeModalBtn.addEventListener('click', closeTaskModal);

        // Save changes with the save button
        saveTaskBtn.addEventListener('click', saveTaskChanges);

        // Populate default color swatches
        function populateColorSwatches() {
             defaultColorSwatchesContainer = document.getElementById('defaultColorSwatches');
             defaultColorSwatchesContainer.innerHTML = ''; // Clear existing swatches
             defaultColors.forEach(color => {
                 const swatch = document.createElement('span');
                 swatch.className = 'color-swatch';
                 swatch.style.backgroundColor = color;
                 swatch.dataset.color = color; // Store color value
                 swatch.addEventListener('click', handleSwatchClick);
                 defaultColorSwatchesContainer.appendChild(swatch);
             });
        }

        // Handle click on a color swatch
        function handleSwatchClick(event) {
             const selectedColor = event.target.dataset.color;
             modalTaskColor.value = selectedColor; // Set the color picker value
             updateColorSwatchSelection(selectedColor); // Update swatch visual selection
        }

        // Update the visual selection of the color swatches
        function updateColorSwatchSelection(selectedColor) {
             const swatches = defaultColorSwatchesContainer.querySelectorAll('.color-swatch');
             swatches.forEach(swatch => {
                 swatch.classList.remove('selected');
                 if (swatch.dataset.color === selectedColor) {
                     swatch.classList.add('selected');
                 }
             });
        }

        // --- Board Management ---

        /**
         * Renders the board tabs.
         */
        function renderBoardTabs() {
            boardTabsContainer.innerHTML = ''; // Clear existing tabs

             // Add the Main Board tab first
             const mainBoardTab = document.createElement('button');
             mainBoardTab.className = `tab-button ${activeBoardId === MAIN_BOARD_ID ? 'active' : ''}`;
             mainBoardTab.dataset.boardId = MAIN_BOARD_ID;
             mainBoardTab.textContent = 'Main Board';
             mainBoardTab.addEventListener('click', () => switchBoard(MAIN_BOARD_ID));
             // No double-click or delete for the main board tab
             boardTabsContainer.appendChild(mainBoardTab);


            // Add tabs for each regular board
            const regularBoardIds = Object.keys(boards).filter(id => id !== MAIN_BOARD_ID);
            regularBoardIds.forEach(boardId => {
                const board = boards[boardId];
                const tabButton = document.createElement('button');
                tabButton.className = `tab-button ${boardId === activeBoardId ? 'active' : ''}`;
                tabButton.dataset.boardId = boardId;

                 // Add color indicator
                 const colorIndicator = document.createElement('span');
                 colorIndicator.className = 'tab-color-indicator';
                 colorIndicator.style.backgroundColor = board.color || defaultBoardColors[0]; // Use board color or a default
                 tabButton.appendChild(colorIndicator);

                 // Add board name text
                 const nameSpan = document.createElement('span');
                 nameSpan.textContent = board.name;
                 tabButton.appendChild(nameSpan);


                // Add delete button to the tab (except for the last regular board)
                if (regularBoardIds.length > 1) {
                     const deleteBtn = document.createElement('button');
                     deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                     deleteBtn.className = 'delete-board-btn';
                     deleteBtn.title = `Delete board "${board.name}"`;
                     deleteBtn.addEventListener('click', (event) => {
                         event.stopPropagation(); // Prevent activating the tab when clicking delete
                         deleteBoard(boardId);
                     });
                     tabButton.appendChild(deleteBtn);
                }

                // Add event listeners
                tabButton.addEventListener('click', () => switchBoard(boardId));
                tabButton.addEventListener('dblclick', handleBoardTabDoubleClick); // Add double-click listener

                boardTabsContainer.appendChild(tabButton);
            });

            // Add "Add Board" tab
            const addBoardTab = document.createElement('button');
            addBoardTab.id = 'addBoardTab';
            addBoardTab.innerHTML = '<i class="fas fa-plus"></i> Add Board';
            addBoardTab.addEventListener('click', addBoard);
            boardTabsContainer.appendChild(addBoardTab);
        }

        /**
         * Handles the double-click event on a board tab to enable editing.
         * @param {Event} event - The dblclick event.
         */
        function handleBoardTabDoubleClick(event) {
            const tabButton = event.target.closest('.tab-button');
            if (!tabButton) return;

            const boardId = tabButton.dataset.boardId;
            // Prevent editing the Main Board tab
            if (boardId === MAIN_BOARD_ID) return;

            const board = boards[boardId];
            const currentName = board.name;
            const currentColor = board.color || defaultBoardColors[0]; // Get current color or default

            // Prevent switching boards when double-clicking to edit
            event.stopPropagation();

            // Create a container for the input and color picker
            const editContainer = document.createElement('div');
            editContainer.className = 'tab-edit-container';
            // Prevent clicks inside the edit container from propagating and triggering board switch
            editContainer.addEventListener('click', (e) => e.stopPropagation());


            // Create an input element for the name
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = currentName;

            // Create a color input element for the color
            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.value = currentColor;


            editContainer.appendChild(nameInput);
            editContainer.appendChild(colorInput);


            // Temporarily store the delete button if it exists
            const deleteBtn = tabButton.querySelector('.delete-board-btn');
            if (deleteBtn) {
                deleteBtn.remove(); // Remove delete button during editing
            }


            // Replace the button's content with the edit container
            tabButton.innerHTML = ''; // Clear existing content
            tabButton.appendChild(editContainer);

            // Focus the name input and select the text
            nameInput.focus();
            nameInput.select();

            // Flag to prevent saving when interacting with the color picker
            let isPickingColor = false;

            // Add mousedown listener to color input to prevent blur on click
            colorInput.addEventListener('mousedown', (e) => {
                isPickingColor = true;
                // e.preventDefault(); // Prevent default mousedown behavior if needed
            });

            // Add change listener to color input to reset flag after color is picked
            colorInput.addEventListener('change', () => {
                isPickingColor = false;
                // The blur event will handle saving after the color picker closes
            });


            // Add event listeners to save the new name and color
            const saveChanges = (event) => {
                 // Check if the blur is happening because focus is moving to the color input
                 // Use event.relatedTarget to see which element is gaining focus
                 if (event && event.relatedTarget && (event.relatedTarget === colorInput || colorInput.contains(event.relatedTarget))) {
                     // Focus is moving to the color input or within it, don't save yet
                     return;
                 }

                const newName = nameInput.value.trim();
                const newColor = colorInput.value;

                // Only update if changes were made
                if (newName && (newName !== currentName || newColor !== currentColor)) {
                     board.name = newName;
                     board.color = newColor;
                     saveBoards(); // Save the updated state
                } else if (!newName) {
                     alert('Board name cannot be empty.'); // Prevent saving with empty name
                     // Do not re-render, keep the input open for correction
                     nameInput.focus();
                     return;
                }

                // Re-render all tabs to update the display and re-attach listeners
                renderBoardTabs();
            };

            // Save on blur for both inputs
            // Use a small timeout for the name input blur to allow the color picker to open
             nameInput.addEventListener('blur', (event) => {
                 setTimeout(() => saveChanges(event), 50); // Add a small delay
             });
            colorInput.addEventListener('blur', saveChanges); // Save when color input loses focus


            // Save on Enter key press in the name input
            nameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Prevent default form submission
                    saveChanges(); // Save on Enter key
                }
            });

            // Save on Enter key press in the color input (less common, but good practice)
             colorInput.addEventListener('keypress', function(e) {
                 if (e.key === 'Enter') {
                     e.preventDefault();
                     saveChanges();
                 }
             });
        }


        /**
         * Switches to the specified board.
         * @param {string} boardId - The ID of the board to switch to.
         */
        function switchBoard(boardId) {
            if (activeBoardId === boardId) return; // Already on this board

            activeBoardId = boardId;
            saveBoards(); // Save the state with the new active board
            renderBoardTabs(); // Update tab highlighting
            renderBoardContent(); // Render the content of the new board
        }

        /**
         * Adds a new board.
         */
        function addBoard() {
            const boardName = prompt("Enter name for the new board:");
            if (boardName && boardName.trim() !== '') {
                const newBoardId = generateId();
                 // Assign a random default color to the new board
                 const randomColor = defaultBoardColors[Math.floor(Math.random() * defaultBoardColors.length)];

                boards[newBoardId] = {
                    name: boardName.trim(),
                     color: randomColor, // Assign the random default color
                     // Initialize with default columns
                    columns: [
                        { id: 'todo', name: 'To Do', color: '#f87171' }, // Red
                        { id: 'inprogress', name: 'In Progress', color: '#facc15' }, // Yellow
                        { id: 'review', name: 'Review', color: '#a78bfa' }, // Purple
                        { id: 'done', name: 'Done', color: '#4ade80' } // Green
                    ],
                    tasks: []
                };
                activeBoardId = newBoardId; // Switch to the new board
                saveBoards();
                renderBoardTabs();
                renderBoardContent();
            }
        }

        /**
         * Deletes a board by its ID.
         * @param {string} boardId - The ID of the board to delete.
         */
        function deleteBoard(boardId) {
            // Count only regular boards
            const regularBoardIds = Object.keys(boards).filter(id => id !== MAIN_BOARD_ID);

            if (regularBoardIds.length <= 1) {
                alert("Cannot delete the last project board."); // Use a simple alert for now
                return;
            }

            if (confirm(`Are you sure you want to delete the board "${boards[boardId].name}"? This action cannot be undone.`)) {
                delete boards[boardId]; // Remove the board from the state

                // If the deleted board was the active one, switch to the first remaining regular board or the main board
                if (activeBoardId === boardId) {
                     const remainingRegularBoardIds = Object.keys(boards).filter(id => id !== MAIN_BOARD_ID);
                    activeBoardId = remainingRegularBoardIds.length > 0 ? remainingRegularBoardIds[0] : MAIN_BOARD_ID;
                }

                saveBoards();
                renderBoardTabs();
                renderBoardContent();
            }
        }

        // --- Import/Export Functions ---

        /**
         * Exports the data for the current active board as a JSON file.
         * Does not export the Main Board view.
         */
        function exportTasks() {
             if (activeBoardId === MAIN_BOARD_ID) {
                 alert("Cannot export the Main Board view. Please select a project board to export.");
                 return;
             }
             if (!activeBoardId || !boards[activeBoardId]) {
                 alert("No active board to export.");
                 return;
             }
             const boardData = boards[activeBoardId];
             const dataStr = JSON.stringify(boardData, null, 2); // Pretty print JSON
             const blob = new Blob([dataStr], { type: 'application/json' });
             const url = URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.href = url;
             a.download = `${boardData.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_board_export.json`; // Sanitize filename
             document.body.appendChild(a);
             a.click();
             document.body.removeChild(a);
             URL.revokeObjectURL(url); // Clean up the URL object
         }

         /**
          * Imports board data from a selected JSON file into the current active board.
          * Imports as a new board, does not affect the Main Board view directly.
          */
         function importTasks(event) {
             const file = event.target.files[0];
             if (!file) return;

             // We will always import as a new board, regardless of the active board
             // if (!activeBoardId) {
             //     alert("Please select or create a board before importing.");
             //     return;
             // }

             const reader = new FileReader();
             reader.onload = function(e) {
                 try {
                     const importedBoardData = JSON.parse(e.target.result);

                     // Basic validation: check if it looks like board data
                     if (importedBoardData && importedBoardData.name && Array.isArray(importedBoardData.tasks) && Array.isArray(importedBoardData.columns)) {
                          // Assign a new ID to the imported board to avoid conflicts
                          const newBoardId = generateId();
                           // Assign new IDs to imported tasks to prevent conflicts
                           importedBoardData.tasks.forEach(task => task.id = generateId());
                           // Ensure columns have IDs if they somehow don't (shouldn't happen with current export)
                           importedBoardData.columns.forEach(col => col.id = col.id || generateId());

                           // Ensure imported board has a color, assign default if not
                           importedBoardData.color = importedBoardData.color || defaultBoardColors[0];


                          boards[newBoardId] = importedBoardData;
                          activeBoardId = newBoardId; // Switch to the newly imported board

                         saveBoards();
                         renderBoardTabs();
                         renderBoardContent();
                         alert(`Board "${importedBoardData.name}" imported successfully!`);
                     } else {
                         alert("Invalid file format. Please select a valid Kanban board JSON file.");
                     }
                 } catch (error) {
                     alert("Error reading file: " + error.message);
                     console.error("Import failed:", error);
                 } finally {
                     // Clear the file input so the same file can be selected again if needed
                     event.target.value = '';
                 }
             };
             reader.readAsText(file);
         }

         /**
          * Exports the data for ALL boards (excluding the main board view) as a single JSON file.
          */
         function exportAllBoards() {
             // Create a copy of boards data, excluding the main board view if it were stored
             const boardsToExport = {};
             for (const boardId in boards) {
                 if (boardId !== MAIN_BOARD_ID) {
                     boardsToExport[boardId] = boards[boardId];
                 }
             }

             const dataStr = JSON.stringify(boardsToExport, null, 2); // Pretty print JSON
             const blob = new Blob([dataStr], { type: 'application/json' });
             const url = URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.href = url;
             a.download = 'all_kanban_boards_export.json';
             document.body.appendChild(a);
             a.click();
             document.body.removeChild(a);
             URL.revokeObjectURL(url); // Clean up the URL object
         }

         /**
          * Imports data for ALL boards from a selected JSON file, replacing current boards.
          * This will overwrite existing project boards but will not affect the Main Board view logic.
          */
         function importAllBoards(event) {
             const file = event.target.files[0];
             if (!file) return;

             if (!confirm("Importing all boards will replace your current project boards. Are you sure?")) {
                 // Clear the file input if the user cancels
                  event.target.value = '';
                 return;
             }

             const reader = new FileReader();
             reader.onload = function(e) {
                 try {
                     const importedBoards = JSON.parse(e.target.result);

                     // Basic validation: check if it's an object and contains board-like structures
                     if (typeof importedBoards === 'object' && importedBoards !== null) {
                         // Filter out any potential 'main-board' entry if it was somehow included in the export
                         const filteredImportedBoards = {};
                         for (const boardId in importedBoards) {
                             if (boardId !== MAIN_BOARD_ID) {
                                 // Ensure imported boards have a color, assign default if not
                                 importedBoards[boardId].color = importedBoards[boardId].color || defaultBoardColors[0];
                                 filteredImportedBoards[boardId] = importedBoards[boardId];
                             }
                         }

                         boards = filteredImportedBoards; // Replace current boards with imported ones

                         // Ensure there's at least one board after import, if not, create a default
                         if (Object.keys(boards).length === 0) {
                             const defaultBoardId = generateId();
                             boards[defaultBoardId] = {
                                 name: 'Imported Default Board',
                                  color: defaultBoardColors[0], // Assign a default color
                                 columns: [
                                     { id: 'todo', name: 'To Do', color: '#f87171' },
                                     { id: 'inprogress', name: 'In Progress', color: '#facc15' },
                                     { id: 'review', name: 'Review', color: '#a78bfa' },
                                     { id: 'done', name: 'Done', color: '#4ade80' }
                                 ],
                                 tasks: []
                             };
                         }

                         // Set the active board to the first one in the imported data, or the default if created
                         activeBoardId = Object.keys(boards).length > 0 ? Object.keys(boards)[0] : null;

                         saveBoards();
                         renderBoardTabs();
                         renderBoardContent();
                         alert("All boards imported successfully!");
                     } else {
                         alert("Invalid file format. Please select a valid ALL boards JSON file.");
                     }
                 } catch (error) {
                     alert("Error reading file: " + error.message);
                     console.error("Import all boards failed:", error);
                 } finally {
                     // Clear the file input so the same file can be selected again if needed
                     event.target.value = '';
                 }
             };
             reader.readAsText(file);
         }


         /**
          * Clears all tasks from the currently active board.
          * Does not affect the Main Board view or tasks on other boards.
          */
         function clearAllTasks() {
             if (activeBoardId === MAIN_BOARD_ID) {
                 alert("Cannot clear tasks from the Main Board view. Please select a project board to clear.");
                 return;
             }
             if (!activeBoardId || !boards[activeBoardId]) {
                 alert("No active board to clear.");
                 return;
             }
             if (confirm(`Are you sure you want to clear all tasks from the board "${boards[activeBoardId].name}"? This action cannot be undone.`)) {
                 boards[activeBoardId].tasks = []; // Clear the tasks array for the active board
                 saveBoards(); // Save the updated state
                 renderTasks(); // Re-render to show empty columns
             }
         }

         /**
          * Updates the visibility and text of the action buttons based on the active board.
          */
         function updateActionButtonVisibility() {
             const isMainBoard = activeBoardId === MAIN_BOARD_ID;

             // Export/Import Board buttons
             exportTasksBtn.style.display = isMainBoard ? 'none' : 'block';
             importTasksBtn.style.display = isMainBoard ? 'none' : 'block';
             importTasksInput.style.display = 'none'; // Always hidden, triggered by button
             clearAllTasksBtn.style.display = isMainBoard ? 'none' : 'block';

             // Export/Import All Boards buttons are always visible
             exportAllBoardsBtn.style.display = 'block';
             importAllBoardsBtn.style.display = 'block';
             importAllBoardsInput.style.display = 'none'; // Always hidden, triggered by button
         }


        // --- Floating Action Button (FAB) and Actions ---

        let fabVisible = false; // State to track if action buttons are visible

        /**
         * Toggles the visibility of the action buttons container.
         */
        function toggleActionButtons() {
            fabVisible = !fabVisible;
            actionButtonsContainer.classList.toggle('visible', fabVisible);
            // Optional: Change FAB icon based on state
            floatingActionButton.querySelector('i').className = fabVisible ? 'fas fa-times' : 'fas fa-cog';
        }


        // --- Initialization ---

        /**
         * Initializes the board by loading data, rendering tabs, and setting up the initial board view.
         */
        function initializeBoard() {
            // Get DOM elements that are only available after password unlock
            boardTabsContainer = document.getElementById('boardTabs');
            boardContainer = document.getElementById('boardContainer');
            floatingActionButton = document.getElementById('floatingActionButton');
            actionButtonsContainer = document.getElementById('actionButtonsContainer');
            exportTasksBtn = document.getElementById('exportTasksBtn');
            importTasksBtn = document.getElementById('importTasksBtn');
            importTasksInput = document.getElementById('importTasksInput');
            clearAllTasksBtn = document.getElementById('clearAllTasksBtn');
            exportAllBoardsBtn = document.getElementById('exportAllBoardsBtn');
            importAllBoardsBtn = document.getElementById('importAllBoardsBtn');
            importAllBoardsInput = document.getElementById('importAllBoardsInput');
            defaultColorSwatchesContainer = document.getElementById('defaultColorSwatches');


            boards = loadBoards(); // Load boards from local storage

            // If no boards are loaded (excluding the main board ID if it somehow exists), create a default one
            const regularBoardIds = Object.keys(boards).filter(id => id !== MAIN_BOARD_ID);
            if (regularBoardIds.length === 0) {
                const defaultBoardId = generateId();
                boards[defaultBoardId] = {
                    name: 'My First Board',
                     color: defaultBoardColors[0], // Assign a default color
                     // Define default columns with IDs and names
                    columns: [
                        { id: 'todo', name: 'To Do', color: '#f87171' }, // Red
                        { id: 'inprogress', name: 'In Progress', color: '#facc15' }, // Yellow
                        { id: 'review', name: 'Review', color: '#a78bfa' }, // Purple
                        { id: 'done', name: 'Done', color: '#4ade80' } // Green
                    ],
                    tasks: []
                };
                 activeBoardId = defaultBoardId; // Set the default board as active
                saveBoards(); // Save the initial default board
            } else {
                // Ensure existing boards have a color property if loading old data
                 regularBoardIds.forEach(boardId => {
                     if (boards[boardId].color === undefined) {
                         boards[boardId].color = defaultBoardColors[0]; // Assign a default color
                     }
                 });
                 saveBoards(); // Save with added colors if necessary

                // Set the active board to the first one in the imported data, or the default if created
                 activeBoardId = regularBoardIds.length > 0 ? regularBoardIds[0] : MAIN_BOARD_ID;
            }

            renderBoardTabs(); // Render the board tabs
            renderBoardContent(); // Render the initial active board content
            populateColorSwatches(); // Populate the color swatches in the modal

            // Add event listeners for FAB and action buttons
            floatingActionButton.addEventListener('click', toggleActionButtons);
            exportTasksBtn.addEventListener('click', exportTasks);
            importTasksBtn.addEventListener('click', () => importTasksInput.click()); // Trigger file input click
            importTasksInput.addEventListener('change', importTasks);
            clearAllTasksBtn.addEventListener('click', clearAllTasks);
            exportAllBoardsBtn.addEventListener('click', exportAllBoards);
            importAllBoardsBtn.addEventListener('click', () => importAllBoardsInput.click()); // Trigger file input click
            importAllBoardsInput.addEventListener('change', importAllBoards);

            // Close action buttons if clicking anywhere else
             document.addEventListener('click', function(event) {
                 const isClickInsideFab = floatingActionButton.contains(event.target);
                 const isClickInsideActions = actionButtonsContainer.contains(event.target);

                 if (fabVisible && !isClickInsideFab && !isClickInsideActions) {
                     toggleActionButtons(); // Hide buttons if clicked outside
                 }
             });

             // Prevent clicks inside the action container from closing it
             actionButtonsContainer.addEventListener('click', function(event) {
                 event.stopPropagation();
             });

        }

        // The password check is the entry point, initializeBoard is called after successful unlock.
        // The password overlay is shown by default via HTML/CSS.

    </script>
